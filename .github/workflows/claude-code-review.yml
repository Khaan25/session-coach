name: Claude PR review

# An AI review of every pull request that is ready for review, adapted from
# 8xsocial/template-monorepo (MIT). Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN
# (`claude setup-token`). Without it the job passes and does nothing. It never blocks a
# merge: continue-on-error keeps an upstream outage from turning a PR red.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # `secrets` is not available in a job-level `if`, so the presence check is a step.
      - name: Check for Claude token
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the review."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.check.outputs.enabled == 'true'
        with:
          # A shallow checkout has no merge base, so `git diff origin/main...HEAD` fails.
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217
        if: steps.check.outputs.enabled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: >-
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            Review this PR for correctness bugs, security issues, regressions and
            performance problems. Follow AGENTS.md and the docs/rules/ files it links to.
            Hold the shared-contract rules to the letter: changes to packages/shared or
            supabase/migrations, RLS and the service-role boundary, and the Play Stats
            API shape in docs/PLAY_API.md. Prioritize actionable defects introduced by
            this PR; no praise-only comments. Review directly without subagents.
